<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1626" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="エイゴログ">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<title>エイゴログ</title>
<style>
/* ===== 色（明るい画面／暗い画面） ===== */
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --ink:#14213D; --sub:#4A5672; --line:#D8DEEA;
  --pri:#1E5BB8; --pri-ink:#FFFFFF; --pri-pale:#E3ECFA; --acc:#E07B16;
  --ok:#1C8A4B; --ok-bg:#E1F3E8; --ng:#C53030; --ng-bg:#FBE4E4; --warn-bg:#FFF4E0;
  --npc:#EAF0FA; --me:#1E5BB8; --me-ink:#FFFFFF;
  --gold:#C29A12; --silver:#7D8A9C; --bronze:#B06A2C;
  --shadow:0 1px 3px rgba(20,33,61,.12);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1626; --card:#18233A; --ink:#EEF2FA; --sub:#B3BED4; --line:#2E3C5A;
    --pri:#3A78DA; --pri-ink:#FFFFFF; --pri-pale:#1F2E4D; --acc:#F5A04A;
    --ok:#52C486; --ok-bg:#15372A; --ng:#F07878; --ng-bg:#3D1D22; --warn-bg:#3A2C14;
    --npc:#22304D; --me:#3A78DA; --me-ink:#FFFFFF; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;
  font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.en{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;letter-spacing:.01em}

/* ===== 共通部品 ===== */
#view{padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
body.full #view{padding:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
.top h1{font-size:22px;margin:0;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--pri-pale);color:var(--ink);font-size:14px;font-weight:600;border:0}
.card{background:var(--card);border-radius:16px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{font-size:17px;margin:0 0 8px}
.muted{color:var(--sub);font-size:15px}
.small{font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:14px;border:0;
  background:var(--pri);color:var(--pri-ink);font-size:18px;font-weight:700;padding:10px 16px;margin:0 0 10px}
.btn.big{min-height:72px;font-size:20px}
.btn.sub{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:var(--card);color:var(--ng);border:1.5px solid var(--ng)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px}
.row>*{flex:1}
.banner{background:var(--warn-bg);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--pri-pale);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--sub)}
select,input[type=text],textarea{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:8px 12px;font-size:17px}
label.f{display:block;font-weight:700;margin:12px 0 6px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;min-height:46px;border:0;background:var(--card);font-weight:600;font-size:15px}
.seg button.on{background:var(--pri);color:var(--pri-ink)}
table.kv{width:100%;border-collapse:collapse;font-size:15px}
table.kv td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.kv td:first-child{color:var(--sub);width:42%}
.ok{color:var(--ok)} .ng{color:var(--ng)}

/* ===== 下のタブ ===== */
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);
  padding:4px env(safe-area-inset-right) calc(4px + env(safe-area-inset-bottom)) env(safe-area-inset-left);z-index:5}
#tabs button{flex:1;border:0;background:none;padding:6px 0;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px}
#tabs button b{font-size:24px;line-height:1}
#tabs button.on{color:var(--pri);font-weight:700}
body.full #tabs{display:none}

/* ===== 旅マップ ===== */
.route{position:relative;padding-left:8px}
.cpt{display:flex;align-items:center;gap:12px;position:relative;padding:8px 0}
.cpt:not(:last-child)::after{content:"";position:absolute;left:27px;top:60px;bottom:-8px;border-left:3px dotted var(--line)}
.cpt .dot{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--card);border:2px solid var(--line);flex:none}
.cpt.open .dot{border-color:var(--pri);background:var(--pri-pale)}
.cpt.lock{opacity:.55}
.cpt .t{font-weight:700}
.cpt button{border:0;background:none;text-align:left;padding:0;flex:1;display:flex;align-items:center;gap:12px}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--line);margin-left:4px;font-weight:600}
.tag.boss{background:var(--acc);color:#fff}

/* ===== 会話画面 ===== */
.screen{display:flex;flex-direction:column;height:100vh;height:100dvh}
.shead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.shead .x{width:44px;height:44px;border-radius:50%;border:0;background:var(--pri-pale);font-size:20px;flex:none}
.shead .ttl{flex:1;font-weight:800;font-size:17px}
.chat{flex:1;overflow-y:auto;padding:12px 12px 4px;-webkit-overflow-scrolling:touch}
.msg{display:flex;gap:8px;margin:0 0 12px;align-items:flex-end}
.msg .av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;color:#fff}
.msg .bub{max-width:80%;padding:10px 14px;border-radius:18px;background:var(--npc);font-size:18px}
.msg .bub .ja{display:block;font-size:13px;color:var(--sub);margin-top:4px}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--me);color:var(--me-ink);border-bottom-right-radius:6px}
.msg.npc .bub{border-bottom-left-radius:6px}
.msg.sys{justify-content:center}
.msg.sys .bub{background:transparent;font-size:13px;color:var(--sub);padding:2px 8px}
.hidden-line{letter-spacing:.2em;color:var(--sub)}
body.speaking .msg.npc.cur .av{animation:talk .6s infinite alternate}
@keyframes talk{from{transform:scale(1)}to{transform:scale(1.12)}}
.dock{background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(10px + env(safe-area-inset-bottom))}
.tools{display:flex;gap:6px;margin-bottom:8px}
.tools button{flex:1;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:700;padding:2px}
.tools button:disabled{opacity:.4}
.hintbox{background:var(--warn-bg);border-radius:12px;padding:8px 12px;margin:0 0 8px;font-size:15px}
.choices{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.choices button{border:1.5px solid var(--pri);background:var(--pri-pale);border-radius:99px;padding:8px 14px;font-size:16px;min-height:44px}
.choices button.on{background:var(--pri);color:var(--pri-ink);font-weight:700}
.choices.ans button{flex:1 1 100%;border-radius:12px;min-height:52px;font-size:17px;text-align:left}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:40px;box-shadow:0 4px 14px rgba(224,123,22,.35)}
.mic.on{background:var(--ng);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(197,48,48,.5)}100%{box-shadow:0 0 0 22px rgba(197,48,48,0)}}
.live{min-height:24px;font-size:15px;color:var(--sub);text-align:center}
.kbd{display:flex;gap:8px}
.kbd input{flex:1}
.kbd button{flex:none;min-width:84px;border-radius:12px;border:0;background:var(--pri);color:var(--pri-ink);font-weight:700}

/* ===== 発音チェック ===== */
.pcard{padding:16px}
.pen{font-size:26px;font-weight:700;margin:6px 0}
.score{font-size:56px;font-weight:800;line-height:1}
.w{display:inline-block;padding:2px 6px;margin:2px;border-radius:8px;font-size:20px;font-weight:600}
.w.g{background:var(--ok-bg);color:var(--ok)}
.w.r{background:var(--ng-bg);color:var(--ng);text-decoration:underline wavy}
.w.x{background:var(--line);color:var(--sub)}

/* ===== 振り返り ===== */
.stamp{width:120px;height:120px;border-radius:50%;margin:8px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:5px double currentColor;font-weight:800;transform:rotate(-8deg)}
.stamp b{font-size:34px}
.stamp.gold{color:var(--gold)} .stamp.silver{color:var(--silver)} .stamp.bronze{color:var(--bronze)}
.turn{border-top:1px solid var(--line);padding:10px 0}
.turn:first-child{border-top:0}
.ex{display:flex;align-items:center;gap:6px;margin:4px 0}
.ex button{border:0;background:var(--pri-pale);border-radius:99px;width:36px;height:36px;flex:none}

/* ===== 診断 ===== */
.vlist{max-height:320px;overflow:auto}
.vrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.vrow span{flex:1}
.vrow button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;min-height:38px;padding:0 10px;font-size:14px}
textarea.log{min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:12px}

#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:88%;
  background:#14213D;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:.95}
</style>
</head>
<body>
<main id="view"></main>
<nav id="tabs">
  <button data-act="tab" data-arg="home"><b>🏠</b>今日</button>
  <button data-act="tab" data-arg="trip"><b>🗺️</b>旅</button>
  <button data-act="tab" data-arg="settings"><b>⚙️</b>設定</button>
</nav>
<div id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>

<script>
'use strict';
const APP_VERSION = '2026.11.12-2';

/* =====================================================================
   教材データ（あとから足しやすいように、ここにまとめて書く）
   ===================================================================== */
const CONTENT = {
  version: 1,

  // 登場人物：gender は声の自動選択に使う（m=男性 f=女性）。pitch=声の高さ rate=話す速さの倍率
  characters: {
    officer: { name: 'Officer', ja: '入国審査官', emoji: '👮', color: '#2F5D9E', gender: 'm', pitch: 0.85, rate: 0.95 }
  },

  // 旅の行程（Stage → チェックポイント）。scenario がある所だけ遊べる（試作版は入国審査のみ）
  stages: [
    { id: 's1', title: 'Stage 1　空港・機内・入国・ホテル', checkpoints: [
      { id: 'basics',      icon: '🧭', title: '出発前：旅の合言葉' },
      { id: 'checkin',     icon: '🧳', title: '出発空港：チェックイン' },
      { id: 'security',    icon: '🛃', title: '保安検査' },
      { id: 'gate',        icon: '🚪', title: '搭乗ゲート' },
      { id: 'meal',        icon: '🍱', title: '機内：食事と飲み物' },
      { id: 'cabin',       icon: '💺', title: '機内：ちょっと困った' },
      { id: 'immigration', icon: '🛂', title: '入国審査', boss: 'mid', scenario: 'sc_immigration',
        mission: '入国審査を通過しよう', phrases: ['p_sorry','p_again','p_slowly','p_here_you_are','p_sightseeing','p_stay_days','p_stay_hotel','p_return_ticket','p_first_time','p_thank_you'] },
      { id: 'baggage',     icon: '🎒', title: '手荷物受取・税関' },
      { id: 'exchange',    icon: '💱', title: '両替所' },
      { id: 'info',        icon: '🗺️', title: '到着ロビー：案内所' },
      { id: 'hotel',       icon: '🏨', title: 'ホテル：チェックイン', boss: 'final' }
    ]},
    { id: 's2', title: 'Stage 2　レストラン・買い物', checkpoints: [] },
    { id: 's3', title: 'Stage 3　道を聞く・交通機関', checkpoints: [] },
    { id: 's4', title: 'Stage 4　自己紹介・雑談', checkpoints: [] },
    { id: 's5', title: 'Stage 5　毎日の会話', checkpoints: [] }
  ],

  // フレーズ：en=英語 ja=日本語 cp=場面 frame=型（入れ替え練習用） alt=同じ意味の言い方 hear=よく言われる相手の言葉
  phrases: {
    p_sorry:        { en: 'Sorry?', ja: 'すみません、もう一度？（聞き返し）', cp: 'basics',
                      hear: [{ en: 'May I see your passport?', ja: 'パスポートを拝見できますか？' }] },
    p_again:        { en: 'Could you say that again?', ja: 'もう一度言っていただけますか？', cp: 'basics', alt: ['Again, please.', 'Pardon?'] },
    p_slowly:       { en: 'Slowly, please.', ja: 'ゆっくりお願いします。', cp: 'basics', alt: ['Could you speak more slowly?'] },
    p_here_you_are: { en: 'Here you are.', ja: 'はい、どうぞ。（物を渡すとき）', cp: 'immigration', alt: ['Here it is.', 'Sure.'],
                      hear: [{ en: 'May I see your passport, please?', ja: 'パスポートを拝見できますか？' }] },
    p_sightseeing:  { en: "I'm here for sightseeing.", ja: '観光で来ました。', cp: 'immigration', frame: "I'm here for ___.",
                      alt: ['Sightseeing.', 'For sightseeing.', 'For travel.'],
                      hear: [{ en: "What's the purpose of your visit?", ja: '訪問の目的は何ですか？' }] },
    p_stay_days:    { en: "I'm staying for five days.", ja: '5日間滞在します。', cp: 'immigration', frame: "I'm staying for ___ days.",
                      alt: ['Five days.', 'For one week.'],
                      hear: [{ en: 'How long will you stay?', ja: 'どのくらい滞在しますか？' }] },
    p_stay_hotel:   { en: "I'm staying at a hotel.", ja: 'ホテルに泊まります。', cp: 'immigration', frame: "I'm staying at ___.",
                      alt: ['At a hotel.'],
                      hear: [{ en: 'Where are you staying?', ja: 'どこに滞在しますか？' }] },
    p_return_ticket:{ en: 'I have a return ticket.', ja: '帰りの航空券があります。', cp: 'immigration', alt: ['Yes, I do.'],
                      hear: [{ en: 'Do you have a return ticket?', ja: '帰りの航空券はありますか？' }] },
    p_first_time:   { en: "It's my first time.", ja: '初めてです。', cp: 'immigration', alt: ['Yes, first time.'],
                      hear: [{ en: 'Is this your first time here?', ja: 'ここに来るのは初めてですか？' }] },
    p_thank_you:    { en: 'Thank you very much.', ja: 'どうもありがとうございます。', cp: 'immigration', alt: ['Thank you.', 'Thanks.'] }
  },

  /* 会話シナリオ
     nodes の各場面：
       say=NPCのセリフ ja=意味 easy=「分かりません」と言われたときのやさしい言い換え
       hint={ja:何と答えるか, first:最初の単語, model:お手本}  choices=言える答えの例  examples=自然な言い方（振り返り用）
       intents=受け付ける答え：match は「単語のまとまり」の並び。まとまりの中は | で「どれか1つ」。全部のまとまりが入っていれば当たり（語順は問わない）
               any:true は「何か答えていれば受け付ける」（自由に答える質問用）
               slot:'duration' は日数を聞き取って reactions で反応を変える
               reply=NPCの返事 next=次の場面（なければ会話終了） phrase=復習に入れるフレーズ */
  scenarios: {
    sc_immigration: {
      cp: 'immigration', title: '入国審査', goal: '入国審査を通過しよう', npc: 'officer', boss: 'mid', start: 'n1', length: 6,
      nodes: {
        n1: { say: 'Hello. May I see your passport, please?', ja: 'こんにちは。パスポートを拝見できますか？', easy: 'Passport, please.',
              hint: { ja: '「はい、どうぞ」と渡す', first: 'Here', model: 'Here you are.' },
              choices: ['Here you are.', 'Here it is.'], examples: ['Here you are.', 'Here it is.', 'Sure. Here you are.'], phrase: 'p_here_you_are',
              intents: [ { id: 'give', match: [['here'], ['sure'], ['ok|okay|yes|yeah']], reply: 'Thank you.', next: 'n2' } ] },
        n2: { say: "What's the purpose of your visit?", ja: '訪問の目的は何ですか？', easy: 'Why are you here? Sightseeing? Business?',
              hint: { ja: '「観光です」と答える', first: 'Sightseeing', model: "I'm here for sightseeing." },
              choices: ['Sightseeing.', "I'm here for sightseeing.", 'Business.'], examples: ["I'm here for sightseeing.", 'Sightseeing.', 'For vacation.'],
              intents: [
                { id: 'visit', match: [['visit|visiting|see|meet', 'family|friend|friends|sister|brother|son|daughter|mother|father|parents|wife|husband|cousin|aunt|uncle']], reply: 'Oh, nice.', next: 'n2c' },
                { id: 'business', match: [['business|work|working|meeting|conference']], reply: 'Business. I see.', next: 'n2b' },
                { id: 'sightseeing', match: [['sightseeing|sightsee|sight|travel|traveling|travelling|vacation|holiday|trip|tourism|tourist|tour|fun|visit|visiting']], reply: 'Sightseeing. Nice.', next: 'n3', phrase: 'p_sightseeing' }
              ] },
        n2b:{ say: 'What kind of business?', ja: 'どんなお仕事ですか？', easy: 'What do you do here?',
              hint: { ja: '「会議があります」と答える', first: 'I', model: 'I have a meeting.' },
              choices: ['I have a meeting.', "I'm here for a meeting."], examples: ['I have a meeting.', "I'm here for a meeting.", 'For work.'],
              intents: [ { id: 'any', any: true, min: 1, reply: 'I see.', next: 'n3' } ] },
        n2c:{ say: 'Where do they live?', ja: 'その方はどこに住んでいますか？', easy: 'Which city?',
              hint: { ja: '「ニューヨークです」と答える', first: 'In', model: 'In New York.' },
              choices: ['In New York.', 'In Boston.'], examples: ['In New York.', 'They live in Boston.', 'Near here.'],
              intents: [ { id: 'any', any: true, min: 1, reply: 'OK.', next: 'n3' } ] },
        n3: { say: 'How long will you stay?', ja: 'どのくらい滞在しますか？', easy: 'How many days?',
              hint: { ja: '「5日間です」と答える', first: 'Five', model: "I'm staying for five days." },
              choices: ['Five days.', 'For one week.', "I'm staying for five days."], examples: ['Five days.', 'For one week.', "I'm staying for five days."], phrase: 'p_stay_days',
              intents: [ { id: 'duration', slot: 'duration', next: 'n4' } ],
              reactions: [ { max: 3, say: 'Just a short trip. OK.' }, { max: 14, say: '{dur}. OK.' }, { max: 99999, say: "{dur}? That's a long stay.", next: 'n3b' } ] },
        n3b:{ say: 'Do you have a return ticket?', ja: '帰りの航空券はありますか？', easy: 'A ticket to go home. Do you have one?',
              hint: { ja: '「はい、あります」と答える', first: 'Yes', model: 'Yes, I have a return ticket.' },
              choices: ['Yes, I do.', 'Yes, I have a return ticket.'], examples: ['Yes, I do.', 'Yes, I have a return ticket.', 'Yes, here it is.'], phrase: 'p_return_ticket',
              intents: [
                { id: 'no', match: [['no|not|nope']], reply: "Please get one before you leave. OK.", next: 'n4' },
                { id: 'yes', match: [['yes|yeah|sure|do|have|here']], reply: 'Good.', next: 'n4' }
              ] },
        n4: { say: 'Where are you staying?', ja: 'どこに滞在しますか？', easy: 'A hotel? A friend\'s house?',
              hint: { ja: '「ホテルです」と答える', first: 'At', model: "I'm staying at a hotel." },

function startPron(cpId) {

  studyStart(); go('pron'); setTimeout(() => playPron(0.85), 300);
}
const curPhrase = () => CONTENT.phrases[P.list[P.idx]];
function playPron(rate) { return speak(curPhrase().en, { who: 'narrator', rate }); }
function vPron() {
  const p = curPhrase(); const r = P.result;
  let body = '';
  if (P.stage === 'listen') {
    body = `<div class="muted">🎧 まず音だけ聞いてみましょう</div><div class="pen hidden-line">・・・・・</div>
      <button class="btn sub" data-act="pronStage" data-arg="shown">📝 文字と意味を見る</button>`;
  } else {
    body = `<div class="pen en">${esc(p.en)}</div><div>${esc(p.ja)}</div>
      ${p.frame ? `<div class="muted small" style="margin-top:6px">型：<span class="en">${esc(p.frame)}</span></div>` : ''}
      ${p.hear ? `<div class="muted small">言われる言葉：<span class="en">${esc(p.hear[0].en)}</span>（${esc(p.hear[0].ja)}）</div>` : ''}`;
  }
  if (r) {
    body += `<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px;text-align:center">
      <div class="score ${r.pass ? 'ok' : 'ng'}">${r.self ? '✔' : r.score}</div><div style="font-weight:700">${r.self ? '言えました（自己採点）' : r.pass ? '合格！' + (r.xp ? ' +' + r.xp + 'XP' : '') : 'もう少し！赤い単語を意識してもう一度'}</div>
      ${r.self ? '' : `<div style="margin-top:8px">${tokHtml(r.E, r.okE)}</div>
      <div class="muted small" style="margin-top:8px">機械に聞こえた英語</div><div>${tokHtml(r.G, r.okG)}</div>`}</div>`;
  }
  return `<div class="screen">
    <div class="shead"><button class="x" data-act="quitPron" aria-label="やめる">✕</button><div class="ttl">📢 発音チェック</div><span class="chip">${P.idx + 1} / ${P.list.length}</span></div>
    <div class="chat"><div class="card pcard">${body}</div>
      <div class="row"><button class="btn sub" data-act="pronPrev" ${P.idx === 0 ? 'disabled' : ''}>← 前へ</button><button class="btn sub" data-act="pronNext">${P.idx === P.list.length - 1 ? '終わる' : '次へ →'}</button></div></div>
    <div class="dock" id="dock"></div></div>`;
}
function renderPronDock() {
  const dock = $('#dock'); if (!dock || !P) return; const mode = inputMode();
  let h = `<div class="tools"><button data-act="pronPlay">🔊 お手本</button><button data-act="pronSlow">🐢 ゆっくり</button></div>`;
  if (mode === 'mic') h += `<div class="micwrap"><button class="mic ${listening ? 'on' : ''}" data-act="pronMic" aria-label="話す">🎤</button><div class="live" id="live">${listening ? '聞いています…' : 'お手本のすぐ後に、真似して言う'}</div></div>`;
  else if (mode === 'keyboard') h += `<form class="kbd" data-form="pron"><input type="text" id="pans" class="en" lang="en" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="🎤で音声入力して送る"><button type="submit">判定</button></form>
      <div class="muted small" style="margin-top:4px">⌨️ キーボードの🌐で「英語」にして、🎤で話してください</div>`;
  else h += `<div class="muted small">📴 オフラインなので発音の判定はできません。お手本の後に声に出して言ってみましょう。</div><button class="btn" style="margin-top:6px" data-act="pronSelf">🙆 声に出して言えた</button>`;
  dock.innerHTML = h;
}
function judgePron(alts) {
  const p = curPhrase();
  const r = scorePron(p.en, alts); const d = day(); d.pron.push(r.score);
  r.xp = 0;
  if (r.pass && !d.pronPassed.includes(P.list[P.idx])) { d.pronPassed.push(P.list[P.idx]); r.xp = 10; addXP(10); srsGrade(P.list[P.idx], 4); }
  save(); P.result = r; P.stage = 'shown'; render();
  diag('pron: ' + JSON.stringify(alts) + ' → ' + r.score + (r.pass ? ' pass' : ''));
}

/* =====================================================================
   ボタンの動き
   ===================================================================== */
const ACT = {
  tab: a => { if (screen === 'conv' || screen === 'pron') { stopSpeaking(); stopListening(); studyStop(); } go(a); },
  startConv: a => startConv(a),
  quitConv: () => { if (!confirm('会話をやめますか？（この会話の結果は残りません）')) return; stopSpeaking(); stopListening(); studyStop(); C.ended = true; go('home'); },
  toReview: () => { if (C && C.result) go('review'); },
  replay: () => { if (!C) return; const last = [...C.log].reverse().find(e => e.who === 'npc'); speak(last ? last.text : curNode().say, { who: C.sc.npc, rate: C.rate }); },
  replaySlow: () => { if (!C) return; const last = [...C.log].reverse().find(e => e.who === 'npc'); speak(last ? last.text : curNode().say, { who: C.sc.npc, rate: 0.7 }); },
  reveal: () => { C.turn.revealed = true; renderConvBody(); },
  hint: () => { if (C.turn.hint >= 3) return; C.turn.hint++; refreshDock(); if (C.turn.hint === 3) speak(curNode().hint.model, { rate: 0.8 }); },
  sayText: a => speak(a, { rate: 0.8 }),
  choose: a => handleAnswer([a]),
  // 答えの例：タップで選ぶ＋お手本。「この答えで進む」でタップのまま答えられる（ヒント3段目と同じ扱い）
  pick: a => { if (!C || !C.turn) return; C.turn.picked = a; refreshDock(); speak(a, { rate: 0.8 }); },
  usePick: () => { if (!C || !C.turn || !C.turn.picked) return; C.turn.hint = 3; C.turn.tapped = true; const a = C.turn.picked; handleAnswer([a]); },
  mic: async () => {
    if (listening) { stopListening(); return; }
    if (C.busy) { stopSpeaking(); }
    refreshDockListening(true);
    const alts = await micListen(t => { const l = $('#live'); if (l) l.textContent = t || '聞いています…'; });
    refreshDock();
    if (alts) handleAnswer(alts);
  },
  pronStage: a => { P.stage = a; render(); },
  pronPlay: () => playPron(0.85),
  pronSlow: () => playPron(0.7),
  pronPrev: () => { if (P.idx > 0) { P.idx--; P.stage = 'listen'; P.result = null; render(); setTimeout(() => playPron(0.85), 200); } },
  pronNext: () => { if (P.idx < P.list.length - 1) { P.idx++; P.stage = 'listen'; P.result = null; render(); setTimeout(() => playPron(0.85), 200); } else { studyStop(); stopSpeaking(); go('home'); toast('おつかれさまでした！'); } },
  pronMic: async () => {
    if (listening) { stopListening(); return; }
    refreshDockListening(true);
    const alts = await micListen(t => { const l = $('#live'); if (l) l.textContent = t || '聞いています…'; });
    renderPronDock();
    if (alts) judgePron(alts);
  },
  pronSelf: () => { const d = day(); if (!d.pronPassed.includes(P.list[P.idx])) { d.pronPassed.push(P.list[P.idx]); addXP(5); } save(); P.result = { self: true, pass: true }; P.stage = 'shown'; render(); },
  quitPron: () => { stopSpeaking(); stopListening(); studyStop(); go('home'); },
  set: a => { const [k, v] = a.split(':'); S.settings[k] = v; save(); render(); },
  retryMic: () => { S.sys.micBroken[ctxKey()] = 0; save(); render(); toast('マイク方式に戻しました'); },
  testVoice: a => speak(a === 'officer' ? 'Hello. May I see your passport, please?' : "I'm here for sightseeing.", { who: a, rate: 0.85 }),
  tryVoice: a => { const v = byURI(a); if (!v || !hasTTS) return; stopSpeaking(); const u = new SpeechSynthesisUtterance('Hello. How long will you stay?'); u.voice = v; u.lang = v.lang; u.rate = 0.85; speechSynthesis.speak(u); },
  micTest: async () => {
    micTest = '聞いています…「Good morning.」と言ってください'; const el = $('#mictest'); if (el) el.textContent = micTest;
    const r = await listen({ onInterim: t => { const e = $('#mictest'); if (e) e.textContent = '聞こえた：' + t; } });
    micTest = r.alts.length ? `✅ 聞き取れました：<b class="en">${esc(r.alts.join(' / '))}</b>` : `❌ 聞き取れませんでした（${esc(r.err || '音が届かない')}${r.started ? '' : '・マイクが始まらない'}）`;
    render();
  },
  volTest: async () => {
    await speak('This is the first test.', { rate: 0.85 });
    toast('いま何か英語で話してください', 2500);
    await listen({ timeout: 5000 }); await sleep(300);
    await speak('This is the third test. Is the sound the same?', { rate: 0.85 });
  },
  copyDiag: async () => {
    const t = diagReport();
    try { await navigator.clipboard.writeText(t); toast('コピーしました'); }
    catch (e) { const l = $('#diaglog'); l.value = t; l.removeAttribute('readonly'); l.select(); toast('全部選んだ状態にしました。長押しでコピーしてください', 4000); }
  },
  exportData: () => exportData(),
  importData: () => $('#importFile').click(),
  resetAll: () => {
    const li = levelInfo(S.player.xp);
    if (!confirm(`いまの記録（Lv.${li.L}・${S.player.xp}XP・学習日数${Object.keys(S.days).length}日）をすべて消します。元に戻せません。よろしいですか？`)) return;
    if (!confirm('本当に消しますか？（先にバックアップの書き出しをおすすめします）')) return;
    const keepSettings = S.settings; S = DEFAULT(); S.settings = keepSettings; save(); go('home'); toast('記録を消しました（設定は残しています）');
  }
};
function refreshDockListening(on) { listening = on; refreshDock(); }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const f = ACT[b.dataset.act]; if (f) { e.preventDefault(); f(b.dataset.arg, b, e); }
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.set; if (!k) return;
  if (k.startsWith('cv:')) S.settings.charVoices[k.slice(3)] = e.target.value; else S.settings[k] = e.target.value;
  save(); render();
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return; e.preventDefault();
  if (f === 'answer') { const i = $('#ans'); const v = i.value.trim(); if (!v) return; i.value = ''; i.blur(); handleAnswer([v]); }
  if (f === 'pron') { const i = $('#pans'); const v = i.value.trim(); if (!v) return; i.value = ''; i.blur(); judgePron([v]); }
});

/* ---------- バックアップ ---------- */
async function exportData() {
  const json = JSON.stringify({ app: 'eigolog', version: APP_VERSION, exportedAt: new Date().toISOString(), data: S }, null, 1);
  const name = `eigolog_${today()}.json`;
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      S.sys.lastBackup = today(); save(); render(); return;
    }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  S.sys.lastBackup = today(); save(); render();
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); const d = j.data || j;
    if (!d || !d.ver || !d.player) throw new Error('形式が違います');
    const a = levelInfo(S.player.xp), b = levelInfo(d.player.xp || 0);
    const msg = `次の内容で、いまの記録を置き換えます。\n\nいま：Lv.${a.L}・${S.player.xp}XP・学習日数${Object.keys(S.days).length}日\n読み込む：Lv.${b.L}・${d.player.xp || 0}XP・学習日数${Object.keys(d.days || {}).length}日（${j.exportedAt ? j.exportedAt.slice(0, 10) + ' に書き出し' : '日付不明'}）\n\nよろしいですか？`;
    if (!confirm(msg)) return;
    S = merge(DEFAULT(), d); save(); go('home'); toast('読み込みました');
  } catch (err) { alert('読み込めませんでした：' + err.message); }
});

/* =====================================================================
   起動
   ===================================================================== */
if (hasTTS) {
  refreshVoices();
  speechSynthesis.onvoiceschanged = () => { refreshVoices(); diag('voices: ' + voices.length); if (['settings', 'diag'].includes(screen)) render(); };
  // iPhoneは声の一覧が遅れて届くことがあるので、何回か取り直す
  let tries = 0; const iv = setInterval(() => { const n = voices.length; refreshVoices(); if (voices.length !== n && ['settings', 'diag'].includes(screen)) render(); if (++tries > 12 || voices.length) clearInterval(iv); }, 300);
}
diag('起動 版' + APP_VERSION + ' / ' + (isStandalone() ? 'ホーム画面' : 'ブラウザ') + ' / 音声認識' + (SR ? 'あり' : 'なし') + ' / ' + (navigator.onLine ? 'オンライン' : 'オフライン') + ' / 答え方 ' + inputMode());
window.addEventListener('pagehide', () => { studyStop(); save(); });
// 電波がない所でも開けるようにする（ゴルフスコア表と同じ仕組み）
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded && screen !== 'conv' && screen !== 'pron') { reloaded = true; location.reload(); } });
}
render();
</script>
</body>
</html>
